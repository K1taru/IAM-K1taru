name: Build portfolio

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: https://portfolio.k1taru.space
          SITE_INDEXABLE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - run: node --test
        working-directory: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: raspberry-pi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PI_SSH_PRIVATE_KEY"
          test -n "$PI_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > "$HOME/.ssh/portfolio-deploy"
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/portfolio-deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy verified commit to Raspberry Pi
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_SSH_PORT: ${{ vars.PI_SSH_PORT || '22' }}
        run: |
          test -n "$PI_HOST"
          test -n "$PI_USER"
          ssh -i "$HOME/.ssh/portfolio-deploy" -p "$PI_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "$PI_USER@$PI_HOST" "bash -se -- '$GITHUB_SHA'" < scripts/deploy-pi.sh
