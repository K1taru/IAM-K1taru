name: Build portfolio

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: https://portfolio.k1taru.space
          SITE_INDEXABLE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - run: node --test
        working-directory: .
