name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh repository metadata and demo health every 6 minutes, offset from
    # the start of the hour to reduce the chance of GitHub Actions congestion.
    - cron: '2-59/6 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refresh status, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: npm run sync:projects && npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://k1taru.github.io/IAM-K1taru

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
